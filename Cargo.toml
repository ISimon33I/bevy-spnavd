[package]
name = "bevy-spnavd"
version = "0.1.0"
edition = "2024"
description = "A Bevy plugin for SpaceMouse devices via spnavd"
documentation = "https://docs.rs/bevy-spnavd"
repository = "https://github.com/ISimon33I/bevy-spnavd"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "spacemouse", "spnav", "input"]
categories = ["game-development", "graphics"]

[dependencies]
bevy = { version = "0.20.0", default-features = false }
spnav-rs = "0.1.1"
tokio = { version = "1.53.2", features = ["rt", "sync"] }

[dev-dependencies]
bevy = { version = "0.20.0", default-features = true }

[badges]
maintenance = { status = "experimental" }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
# Compile the entire crate as one unit.
# Slows compile times, marginal improvements.
codegen-units = 1
# Do a second optimization pass over the entire program, including dependencies.
# Slows compile times, marginal improvements.
lto = "thin"